<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kit</title>
  <meta name="description" content="a collection of small tools">
  <link rel="stylesheet" href="style.css">
  <script>
    (() => {
      const stored = localStorage.getItem("kit-theme");
      const theme = stored ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>

<body>
  <header class="site-header">
    <div class="brand-group">
      <a class="brand" href="#/">kit</a>
      <span class="crumb" id="header-crumb" hidden></span>
    </div>

    <nav class="site-nav" aria-label="tool-search">
      <div class="search-wrap">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="search" id="tool-search" placeholder="Search tools..." aria-label="Search tools" />
      </div>
    </nav>

    <div class="header-actions">
      <a id="source-link" href="https://github.com/chriso345/kit" target="_blank" rel="noopener noreferrer">Source</a>
      <button id="theme-toggle" type="button" class="icon-btn" aria-label="Toggle dark mode">
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <line x1="12" y1="2" x2="12" y2="4.5"></line>
          <line x1="12" y1="19.5" x2="12" y2="22"></line>
          <line x1="4.2" y1="4.2" x2="5.9" y2="5.9"></line>
          <line x1="18.1" y1="18.1" x2="19.8" y2="19.8"></line>
          <line x1="2" y1="12" x2="4.5" y2="12"></line>
          <line x1="19.5" y1="12" x2="22" y2="12"></line>
          <line x1="4.2" y1="19.8" x2="5.9" y2="18.1"></line>
          <line x1="18.1" y1="5.9" x2="19.8" y2="4.2"></line>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer">
    <a href="https://github.com/chriso345/kit" target="_blank" rel="noopener noreferrer">chriso345/kit</a>
    <span>MIT License</span>
  </footer>

  <script type="module" src="app.js"></script>
</body>

</html>
