name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build deps (clang for wasm-tool, jq for the registry script)
        run: sudo apt-get update && sudo apt-get install -y clang jq

      - name: Make build scripts executable
        run: |
          chmod +x scripts/build-registry.sh
          find tools -name build.sh -exec chmod +x {} \;

      - name: Build tools & registry
        run: ./scripts/build-registry.sh

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html app.js _site/
          cp -r tools _site/

      - name: Deploy to gh-pages
        # if: github.event_name == 'push' && github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
